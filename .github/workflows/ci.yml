name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: 20
  LLVM_RUN_CLANG_TIDY_SHA: c13b7485b87909fcf739f62cfa382b55407433c0

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jinja2
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format
        run: |
          clang-format --verbose --dry-run -Werror $(find . -path ./build -prune -o \( -name '*.cpp' -o -name '*.hpp' \) -print)

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${{ env.LLVM_VERSION }} clang-tidy-${{ env.LLVM_VERSION }} libc++-${{ env.LLVM_VERSION }}-dev libc++abi-${{ env.LLVM_VERSION }}-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ env.LLVM_VERSION }} ${{ env.LLVM_VERSION }}
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.LLVM_VERSION }} ${{ env.LLVM_VERSION }}
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-${{ env.LLVM_VERSION }} ${{ env.LLVM_VERSION }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jinja2
          sudo apt-get install -y cmake ninja-build curl libwayland-dev libwayland-bin libxkbcommon-dev wayland-protocols xorg-dev libdbus-1-dev

      - name: Download run-clang-tidy.py
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o run-clang-tidy.py \
            "https://raw.githubusercontent.com/llvm/llvm-project/${LLVM_RUN_CLANG_TIDY_SHA}/clang-tools-extra/clang-tidy/tool/run-clang-tidy.py"

      - name: Configure
        run: |
          cmake --preset=linux-clang-release -DPython_EXECUTABLE="$(command -v python3)"
          cmake --build --preset=linux-clang-release --target generate_all --parallel

      - name: Run clang-tidy
        run: |
          python3 run-clang-tidy.py -clang-tidy-binary clang-tidy-${{ env.LLVM_VERSION }} -p build/linux-clang-release -warnings-as-errors "*" -use-color -quiet -header-filter "(k|m)En[\\/ ]src[\\/ ].*" "[km]En[/\\\\]src[/\\\\]|[km]En[/\\\\]tests[/\\\\]|Sandbox[/\\\\]src[/\\\\]"

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            preset: linux-gcc-release
            packages: "gcc-14 g++-14 libstdc++-14-dev"

          - name: linux-clang
            os: ubuntu-24.04
            preset: linux-clang-release
            packages: "clang-20 libc++-20-dev libc++abi-20-dev"
            llvm_apt: true

          - name: windows-msvc
            os: windows-2022
            preset: windows-msvc-release
            msvc: true

          - name: windows-clang
            os: windows-2022
            preset: windows-clang-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up LLVM ${{ env.LLVM_VERSION }} apt repository
        if: runner.os == 'Linux' && matrix.llvm_apt
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION }} main" | sudo tee /etc/apt/sources.list.d/llvm.list

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jinja2
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.packages }} libwayland-dev libwayland-bin libxkbcommon-dev wayland-protocols xorg-dev libdbus-1-dev
          if dpkg -l gcc-14 &>/dev/null; then
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 14
            sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 14
          fi
          if dpkg -l clang-${{ env.LLVM_VERSION }} &>/dev/null; then
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ env.LLVM_VERSION }} ${{ env.LLVM_VERSION }}
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.LLVM_VERSION }} ${{ env.LLVM_VERSION }}
          fi

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jinja2

      - name: Setup MSVC environment
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --preset=${{ matrix.preset }} -DPython_EXECUTABLE="$(command -v python3)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --preset=${{ matrix.preset }} -DPython_EXECUTABLE="$((Get-Command python3).Path)"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --build --preset=${{ matrix.preset }} --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build --preset=${{ matrix.preset }} --parallel

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ./build/${{ matrix.preset }}
        run: |
          ctest --output-on-failure -j "$(nproc)"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ./build/${{ matrix.preset }}
        run: |
          ctest --output-on-failure -j $env:NUMBER_OF_PROCESSORS
